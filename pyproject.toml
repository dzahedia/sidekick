[project]
name = "coding-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-openai>=0.2,<2",
    "langgraph>=0.2,<2",
    "pydantic>=2.7,<3",
    "pytest>=8,<9",
    "python-dotenv>=1.2.3",
    "streamlit>=1.37,<2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidekick"]
