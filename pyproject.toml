[project]
name = "coding-agent"
version = "1.1.0"
description = "SideKick: a constrained coding agent that edits only explicitly provided files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-openai>=0.2,<2",
    "langgraph>=0.2,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.2.3",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidekick"]
